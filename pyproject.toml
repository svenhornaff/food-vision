[project]
name = "food-vision"
version = "0.1.0"
description = "Photo meal logging with database-grounded nutrition estimates (prototype)."
readme = "README.md"
authors = [{ name = "Sven Hornaff", email = "sven.hornaff@t-systems.com" }]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11.7,<3.0.0",
  "pydantic-settings>=2.10.1,<3.0.0",
  "openai>=1.60.0",
  "httpx>=0.27.0",
  "pillow>=11,<12",
  "pillow-heif>=0.18",
  "numpy>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.9.0",
  "mypy>=1.13.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

# ── Lint / format ────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N"]

[tool.ruff.format]
quote-style = "double"

# ── Types ────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

# ── Tests ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--tb=short",
  "-p", "no:logging",
  "--cov=src/food_vision",
  "--cov-report=term-missing",
  "--cov-fail-under=85",  # doc floor for prestudy/observation/imaging/domain (§9); global coverage is higher in practice
]
markers = [
  "unit: no external dependencies",
]

[tool.coverage.run]
source = ["src/food_vision"]
omit = ["*/__init__.py"]
